# =============================================================================
# 发布新版本（maintainers / agents 请读这里）
#
# 在仓库根目录执行两条命令即可发布：
#   npm version patch        # 或 minor / major：自动改 package.json 版本号并打 v* tag
#   git push --follow-tags   # 推送后本 workflow 自动 lint + test + build 并发布到 npm
#
# 认证方式：npm Trusted Publishing（OIDC），本仓库不保存任何 NPM_TOKEN secret，
# 发布凭证由 GitHub Actions 运行时签发，永不过期。
#
# 依赖 npmjs.com 包页 Settings 里的配置（改本文件名 / 转移仓库时必须同步更新）：
#   - Trusted Publisher = GitHub Actions: flufy3d/JianpuRender / publish.yml
#   - Publishing access = Require 2FA and disallow bypass 2fa tokens
#
# 注意：tag 对应的 package.json 版本必须大于 npm 上已发布的最新版本，
# 否则 publish 会被拒（npm version 流程会自动 bump，正常操作不会遇到）。
# =============================================================================

name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # trusted publishing 要求 npm >= 11.5.1
      - name: Ensure npm >= 11.5.1
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint, test and build
        run: npm run test-and-build

      - name: Publish to npm
        run: npm publish --provenance
